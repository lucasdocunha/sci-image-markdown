model:
  name_or_path: "Qwen/Qwen3-VL-4B-Instruct"
  model_type: "qwen3_vl"
  trust_remote_code: true
  torch_dtype: "bfloat16"
  attn_implementation: "sdpa"
  use_cache: false

peft:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true
