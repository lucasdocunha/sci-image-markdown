# Training Configuration for Qwen3-VL-8B-Instruct with ICDAR Token-Weighted Loss
project_name: "sci-image-markdown"
experiment_name: "qwen3_vl_8b_icdar_loss"
seed: 42

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  splits_dir: "data/splits"
  train_file: "data/processed/train.jsonl"
  val_file: "data/processed/val.jsonl"
  test_file: "data/processed/test.jsonl"
  image_folder: "data/processed"
  max_image_resolution: null
  min_pixels: 50176
  max_pixels: 200704
  max_table_chars: 800
  system_prompt: "You are an expert scientific figure analyzer. Your task is to extract all numerical data points and values plotted in the given scientific figure panel into a structured Markdown table with accurate column headers. Follow these strict guidelines: 1. Peak-Picking: For continuous spectroscopy plots (e.g. RBS, Raman, XRD, XPS, FTIR), locate and extract the precise coordinates and labels of physical peaks and extrema rather than regular grid intervals. 2. Multi-Panel Figures: If the figure contains multiple subplots (panels a, b, c), extract a separate Markdown table for EACH panel. Do not stop early. 3. Pure Numeric Values: Output clean numerical values without approximation symbols (never use '~', 'approx'). 4. Avoid Dummy Progressions: Never output artificial linear progression sequences."

model:
  name_or_path: "Qwen/Qwen3-VL-8B-Instruct"
  model_type: "qwen3_vl"
  trust_remote_code: true
  torch_dtype: "bfloat16"
  attn_implementation: "sdpa"
  use_cache: false

training:
  method: "qlora"
  loss_type: "token_weighted"
  output_dir: "/media/ssd2/datasets/sci-image-markdown-data/outputs/qwen3_vl_8b_icdar_loss"
  num_train_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  optim: "paged_adamw_8bit"
  learning_rate: 1.0e-4
  lr_scheduler_type: "cosine"
  warmup_steps: 20
  weight_decay: 0.01
  logging_steps: 10
  eval_strategy: "no"
  save_strategy: "epoch"
  save_total_limit: 2
  gradient_checkpointing: true
  bf16: false
  fp16: false
  dataloader_num_workers: 2
  report_to: "none"
  metric_loss:
    lambda_metric: 0.3
    rel_tol: 0.05
    numeric_weight: 4.0
    structural_weight: 3.0
    reward_mode: "gpu_tensor"

peft:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

evaluation:
  batch_size: 1
  max_new_tokens: 1024
  temperature: 0.0
  do_sample: false
  numerical_relative_tolerance: 0.05
  output_eval_dir: "/media/ssd2/datasets/sci-image-markdown-data/outputs/eval_results/qwen3_vl_8b_icdar_loss"
