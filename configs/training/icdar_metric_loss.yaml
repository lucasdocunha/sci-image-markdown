# Training Configuration for ICDAR Metric Loss (SCST / Hybrid / Token-Weighted)

training:
  method: "qlora"
  loss_type: "hybrid"  # Options: 'ce' (standard SFT), 'scst' (pure SCST), 'token_weighted' (differentiable surrogate), 'hybrid' (SFT + SCST)
  output_dir: "outputs/checkpoints_icdar_loss"
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  metric_loss:
    lambda_metric: 0.3        # Weight given to the ICDAR metric loss (0.0 to 1.0)
    rel_tol: 0.05             # Relative numerical error tolerance for RMS (5%)
    temperature: 0.7          # Sampling temperature for exploration in SCST
    max_gen_tokens: 512       # Maximum generation tokens during SCST training
    numeric_weight: 3.0       # Weight for numerical tokens in token-weighted mode
    structural_weight: 2.0    # Weight for table structural tokens (| and ---)
