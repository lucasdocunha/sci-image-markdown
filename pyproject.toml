[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sci-image-markdown"
version = "0.1.0"
description = "Scientific Figure and Chart Extraction to Markdown Tables using Vision-Language Models (Sci-ImageMiner Task 2)"
authors = [{ name = "Lucas de Oliveira Cunha", email = "c.oliveira25@pucpr.edu.br" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.48.0",
    "peft>=0.14.0",
    "trl>=0.14.0",
    "accelerate>=0.34.0",
    "bitsandbytes>=0.43.0",
    "datasets>=3.0.0",
    "qwen-vl-utils>=0.0.8",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pillow>=10.2.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "evaluate>=0.4.1",
    "rouge-score>=0.1.2",
    "nltk>=3.8.1",
    "tabulate>=0.9.0",
    "python-Levenshtein>=0.25.0",
    "click>=8.1.7",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

